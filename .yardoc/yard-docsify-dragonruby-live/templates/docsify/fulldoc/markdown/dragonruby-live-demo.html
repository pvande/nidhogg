<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>DragonRuby</title>
  <style>
    body {
      font-family: arial;
      margin: 0;
      padding: none;
    }

    .emscripten {
      padding-right: 0;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }

    div.emscripten {
      text-align: center;
    }

    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten {
      border: 0px none;
      background-color: rgb(40, 44, 52);
    }

    #status {
      display: inline-block;
      font-weight: bold;
      color: rgb(120, 120, 120);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #progress {
      height: 20px;
      width: 30px;
    }

    #output {
      width: 100%;
      height: 200px;
      margin: 0 auto;
      margin-top: 10px;
      border-left: 0px;
      border-right: 0px;
      padding-left: 0px;
      padding-right: 0px;
      display: none;
      background-color: black;
      color: white;
      font-family: 'Lucida Console', Monaco, monospace;
      outline: none;
    }
  </style>
</head>

<body id='toplevel'>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <textarea style="display: none;" id="output" rows="8"></textarea>

  <div class="emscripten" id="status"></div>
  <div class="emscripten" id='progressdiv'>
    <progress value="0" max="100" id="progress"></progress>
  </div>

  <script>window.coi = { coepDegrade: () => false }</script>
  <script type="text/javascript" src="dragonruby-serviceworker.js"></script>
  <script type="text/javascript" src="dragonruby-loader.js"></script>
</body>

</html>
